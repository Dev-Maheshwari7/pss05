<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Institute Repository — DDAS</title>
  <link rel="icon" href="assets/logo.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="app-page">
  <div class="app-layout">
    <div id="appShell" data-active="Repository"></div>

    <main class="app-main">
      <!-- Sticky Topbar Header -->
      <header class="app-topbar">
        <div class="topbar-left">
          <div class="breadcrumb">
            <span>DDAS</span>
            <span class="breadcrumb-sep">/</span>
            <span>Catalog</span>
            <span class="breadcrumb-sep">/</span>
            <span class="breadcrumb-current">Indexed Repositories</span>
          </div>
        </div>
      </header>

      <!-- Scrollable Page Content -->
      <div class="page-content">
        <div class="page-header">
          <div>
            <h1>Institute Repository</h1>
            <p>Unified catalog indexing climate models, satellite tiles, ocean datasets, and research archives.</p>
          </div>
        </div>

        <!-- Metric Ribbon -->
        <section class="kpi-row" id="repoMetrics"></section>

        <!-- Table Card with Toolbar -->
        <div class="table-card">
          <div class="table-toolbar">
            <input id="repoSearch" placeholder="Search by title, provider, region, variable…">
            <select id="typeFilter">
              <option value="">All scientific domains</option>
              <option>Climate</option>
              <option>Remote Sensing</option>
              <option>Oceanography</option>
              <option>Demography</option>
            </select>
            <select id="accessFilter">
              <option value="">All access policies</option>
              <option>Institute-wide</option>
              <option>Lab owned</option>
              <option>Approval required</option>
              <option>Public institute</option>
            </select>
          </div>

          <div style="padding: 10px 16px; background: #ffffff; border-bottom: 1px solid var(--border-line); display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size:12px;font-weight:600;color:var(--ink-700)">Indexed Datasets</span>
            <span id="repoCount" class="tag" style="font-size:11px"></span>
          </div>

          <div class="data-table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Dataset Name</th>
                  <th>Domain</th>
                  <th>Period</th>
                  <th>Size</th>
                  <th>Storage Node</th>
                  <th>Data Owner</th>
                  <th>Access Policy</th>
                  <th>Reuse Count</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="repoBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/repository.js"></script>
</body>
</html>
